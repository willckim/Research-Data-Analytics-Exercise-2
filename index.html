<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Editor</title>

<!--
  Palette. Single source of truth: this block is also copied into every exported
  HTML file, so the one document colour that uses it (the gold rule under the h1)
  follows any change made here.
-->
<style id="palette">
  :root {
    --navy:  #1c2b4a;
    --gold:  #f5b800;
    --paper: #ffffff;
    --ink:   #16181d;
    --muted: #5c6470;
    --rule:  #dfe3e8;
    --bg:    #f4f5f7;
  }
</style>

<!-- Editor chrome. Not exported. -->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--navy);
    text-decoration: underline;
    text-decoration-color: var(--rule);
    transition: text-decoration-color 0.12s linear;
  }
  a:hover { text-decoration-color: var(--gold); }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.55rem 0.9rem;
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    color: #fff;
  }
  #doc-title {
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex: 0 0 auto;
  }

  #tagline {
    flex: 0 0 auto;
    padding: 0.45rem 0.9rem;
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }

  button {
    font: inherit;
    font-size: 13px;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    border-radius: 0;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: background-color 0.12s linear, color 0.12s linear, border-color 0.12s linear;
  }
  button:hover,
  button:active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--navy);
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* View toggle: one group, gold underline marks the active view. */
  #viewtoggle { display: flex; }
  #viewtoggle button {
    margin-left: -1px;
    border-bottom: 3px solid transparent;
  }
  #viewtoggle button:first-child { margin-left: 0; }
  #viewtoggle button[aria-pressed="true"] {
    border-bottom-color: var(--gold);
  }
  #viewtoggle button[aria-pressed="true"]:not(:hover) {
    background: transparent;
    color: #fff;
  }

  #panes {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    background: var(--bg);
  }
  #editor-pane, #preview-pane { min-width: 0; overflow: auto; }
  #editor-pane {
    display: flex;
    background: var(--paper);
    border-right: 1px solid var(--rule);
  }
  /* Desk: the preview pane is the surface, .paper is the sheet lying on it. */
  #preview-pane { background: var(--bg); }

  #panes.view-split #editor-pane,
  #panes.view-split #preview-pane { flex: 1 1 50%; }
  #panes.view-edit #preview-pane { display: none; }
  #panes.view-edit #editor-pane { flex: 1 1 100%; border-right: 0; }
  #panes.view-preview #editor-pane { display: none; }
  #panes.view-preview #preview-pane { flex: 1 1 100%; }

  #source {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    border-left: 3px solid var(--navy);
    outline: none;
    resize: none;
    padding: 1rem;
    font-family: Consolas, "SF Mono", Menlo, Monaco, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--paper);
    tab-size: 4;
  }

  #footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 0.9rem;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--rule);
  }

  @media print {
    #topbar, #tagline, #footer { display: none; }
    #panes { display: block; }
    #editor-pane { display: none !important; }
    #preview-pane { display: block !important; overflow: visible; border: 0; }
  }
</style>

<!--
  Document styling. This exact block is copied verbatim into every exported
  HTML file, so the preview and the export cannot drift apart. Every rule is

<style id="doc-style">

  .paper ul, .paper ol { margin: 1em 0; padding-left: 1.75em; }
  .paper li { margin: 0.5em 0; }
  .paper li > p { margin: 0 0 0.5em; }

  .paper blockquote {

    padding: 0;
    border: 0;
    font-size: 0.95em;
    font-style: normal;
    quotes: none;

  .paper blockquote::before, .paper blockquote::after { content: none; }
  .paper blockquote p { margin: 0 0 0.8em; }

  }
  .paper img { max-width: 100%; }

  @media print {
    @page { margin: 1in; }
    .paper {
      max-width: none;
      margin: 0;
      padding: 0;
      font-size: 12pt;
    }
    .paper table, .paper thead, .paper tr, .paper blockquote {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .paper h1, .paper h2, .paper h3 {
      page-break-after: avoid;
      break-after: avoid;
    }
  }
</style>

# Research Exercise 2

## FASB Accounting Standards Codification

---

## Question 1: Number Series by Category

The Codification arranges its topical categories in numbered series. Assets occupy the 300 series, as noted in the assignment. The remaining categories are as follows.

| Category | Series | Example topics in that range |
| --- | --- | --- |
| Assets | 300 series | 305 Cash and Cash Equivalents; 310 Receivables; 32X Investments; 330 Inventory; 350 Intangibles (Goodwill and Other); 360 Property, Plant, and Equipment |
| Liabilities | 400 series | 405 Liabilities; 410 Asset Retirement and Environmental Obligations; 450 Contingencies; 470 Debt |
| Equity | 500 series | 505 Equity |
| Revenue | 600 series | 606 Revenue from Contracts with Customers; 610 Other Income |
| Expenses | 700 series | 705 Cost of Sales and Services; 730 Research and Development; 740 Income Taxes |

Navigation: from the Codification home page, each category label in the left-hand navigation pane opens a flyout listing the Topics within that series.

---

## Question 2: Glossary Definitions (FASB ASC 310-10-20)

Navigating to Assets > 310 Receivables > 10 Overall > 20 Glossary produces the following definitions.

### a. Current Assets

> "Current assets is used to designate cash and other assets or resources commonly identified as those that are reasonably expected to be realized in cash or sold or consumed during the normal operating cycle of the business."

FASB ASC 310-10-20. The definition cross-references paragraphs 210-10-45-1 through 45-4.

In practice, the measuring period is the entity's normal operating cycle, or one year where that cycle is shorter than a year.

### b. Fair Value

> "The price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date."

FASB ASC 310-10-20.

This is an exit price, meaning the price the entity would get in a hypothetical market transaction, not the amount it originally paid. Both "orderly transaction" and "market participants" are defined terms in the Codification glossary as well.

---

## Question 3: Classification of Tiny Manufacturing Company's Investment

I ran the search the same way Mr. Small did. I typed "Classification of Investment
Securities" into the keyword box, hit Show All Results, opened the Topics tab, and
clicked on Topic 320 for debt securities. That gave me seven results, all of them in
Subtopic 10 (Overall). Six of the seven deal with side issues. Three cover situations
where a security cannot be called held-to-maturity (320-10-25-5, 25-6, and 25-18), one
covers rechecking the classification at each reporting date (320-10-35-5), one covers
how the investment shows up on the statement of cash flows (320-10-45-11), and one
covers measurement after purchase. The seventh result is the paragraph that actually
tells you how to classify a debt security at the time you buy it, so that is the one I
used.

### a. The three categories

At acquisition, a debt security has to go into one of three categories.

1. **Trading securities.** Securities bought with the plan of selling them within hours
   or days. The guidance does say a company is not blocked from calling a security
   trading even if it plans to hold it longer than that.
2. **Available-for-sale securities.** The catch-all category. Any debt security that is
   not trading and not held-to-maturity.
3. **Held-to-maturity securities.** Allowed only when the company has the positive
   intent and ability to hold the security until it matures.

### b. Reference for this guidance

FASB ASC 320-10-25-1. That breaks down as Topic 320 (Investments, Debt Securities),
Subtopic 10 (Overall), Section 25 (Recognition), Paragraph 1. The paragraph sits under
the heading "Classification of Debt Securities." The paragraph right after it, FASB ASC
320-10-25-2, adds that the company has to document the classification when it buys the
security.

### c. How the Microsoft bond should be classified

Tiny Co should report the bond as an available-for-sale security. I worked through the
other two categories first to get there.

Held-to-maturity was the first one I looked at, since holding the bond and collecting
interest is part of what Mr. Small describes. FASB ASC 320-10-25-1(c) only allows that
category when the company has the "positive intent and ability" to hold the security to
maturity. Mr. Small does not have that. He plans to sell in a year or two if rates fall
and the bond gains value, and he will only hold it if that does not happen. FASB ASC
320-10-25-5(b) covers this exact fact pattern. It says a security that is available to
be sold in response to changes in market interest rates cannot go in the
held-to-maturity category, because the chance of a sale shows the company does not have
the intent and ability to hold it. Holding the bond is Mr. Small's fallback plan, not
his actual plan, so that category is out.

Trading does not work either. FASB ASC 320-10-25-1(a) describes trading securities as
ones bought with the intent of selling "within hours or days." Mr. Small is looking at a
one to two year window on the first investment his company has ever made, which is a
long way from that. The same paragraph does say a company is not stopped from calling
something trading even if it plans to hold it longer, but that is permission, not a
requirement, and nothing in the facts says Tiny Co is in the business of trading
securities.

That leaves available-for-sale. FASB ASC 320-10-25-1(b) defines that category as debt
securities "not classified as trading securities or as held-to-maturity securities." It
is the catch-all, and it fits what Mr. Small is actually doing. He might sell the bond
and he might not, but either way he is not day trading it and he has not committed to
holding it to maturity.

The category also drives how the bond shows up on the statements. Under FASB ASC
320-10-35-1, an available-for-sale security is carried at fair value, and the unrealized
holding gains and losses go to other comprehensive income instead of net income until
Tiny Co actually sells. The interest Mr. Small collects still runs through net income as
it is earned. Whether the bond is current or noncurrent depends on Topic 210 and on when
Tiny Co expects to realize it, so with a one to two year horizon it would most likely be
noncurrent unless the company expects to sell within the next year. One last thing worth
adding is that FASB ASC 320-10-35-5 makes the company review the classification at every
reporting date, so if Mr. Small changes his mind about the bond, Tiny Co has to look at
the category again.

---

Source: FASB Accounting Standards Codification, Topics 310 and 320. Accessed via academic access, September 2026.

<script src="vendor/marked.min.js"></script>
<script>
(function () {
  "use strict";

  var SOURCE_FILE = "research_exercise_2.md";
  var STORAGE_KEY = "paper-editor:" + SOURCE_FILE;
  var RENDER_DEBOUNCE_MS = 150;

  /* Minimal base for the exported page. Everything else comes from the
     palette and #doc-style blocks. */
  var EXPORT_BASE_CSS = [
    "  html { background: #fff; }",
    "  body { margin: 0; background: #fff; }",
    ""
  ].join("\n");

  var sourceEl = document.getElementById("source");
  var previewEl = document.getElementById("preview");
  var titleEl = document.getElementById("doc-title");
  var panesEl = document.getElementById("panes");
  var paletteEl = document.getElementById("palette");
  var docStyleEl = document.getElementById("doc-style");
  var resetBtn = document.getElementById("btn-reset");

  /* Standard markdown line breaks: a newline inside a paragraph is hard
     wrapping, not a line break. The paper's prose is wrapped at 88 columns in
     places, and turning those into <br> would shred it. */
  marked.setOptions({ gfm: true, breaks: false });

  /* ---------- rendering ---------- */

  /* The paper opens with a metadata block (name, course, instructor, date)
     sitting above the title. Its line breaks are the one place in the document
     where a newline is meaningful, so that block alone is rendered with them
     preserved. It is identified structurally: the first block of the document,
     when the document opens with a paragraph rather than a heading. */
  function renderMarkdown(src) {
    var tokens = marked.lexer(src);
    var head = "";
    if (tokens.length && tokens[0].type === "paragraph") {
      var meta = tokens.shift();
      head = '<p class="docmeta">' +
             marked.parseInline(meta.text).replace(/\n/g, "<br>\n") +
             "</p>\n";
    }
    return head + marked.parser(tokens);
  }

  function titleFrom(root) {
    var h1 = root.querySelector("h1");
    return h1 ? h1.textContent.trim() : "";
  }

  function render() {
    previewEl.innerHTML = renderMarkdown(sourceEl.value);
    titleEl.textContent = titleFrom(previewEl) || SOURCE_FILE;
  }

  var renderTimer = null;
  function scheduleRender() {
    if (renderTimer) { clearTimeout(renderTimer); }
    renderTimer = setTimeout(function () {
      renderTimer = null;
      render();
      storageSet(sourceEl.value);
    }, RENDER_DEBOUNCE_MS);
  }

  function setSource(text) {
    sourceEl.value = text;
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    render();
  }

  /* ---------- storage (may be unavailable on file:// in some browsers) ---------- */

  function storageGet() {
    try { return window.localStorage.getItem(STORAGE_KEY); }
    catch (e) { return null; }
  }
  function storageSet(value) {
    try { window.localStorage.setItem(STORAGE_KEY, value); }
    catch (e) { /* private mode or file:// restrictions; editing still works */ }
  }
  function storageClear() {
    try { window.localStorage.removeItem(STORAGE_KEY); }
    catch (e) { /* nothing to do */ }
  }

  /* ---------- loading the original ---------- */

  /* Git may check the .md out with CRLF on Windows while the HTML parser hands
     back the inlined copy with LF, so both sides are normalised before use. */
  function normalize(text) {
    return text.replace(/\r\n/g, "\n");
  }

  function inlineFallback() {
    var el = document.getElementById("fallback-md");
    /* Strip only the single newline the script tag adds on each side. */
    return normalize(el.textContent).replace(/^\n/, "").replace(/\n$/, "");
  }

  function loadOriginal() {
    return fetch(SOURCE_FILE, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.text();
      })
      .then(function (text) {
        text = normalize(text);
        if (text.trim() !== inlineFallback().trim()) {
          console.warn(
            "[paper-editor] " + SOURCE_FILE + " no longer matches the inline fallback " +
            "copy in index.html. Update the #fallback-md block so opening the page " +
            "over file:// still shows the current paper."
          );
        }
        return text;
      })
      .catch(function () {
        return inlineFallback();
      });
  }

  /* ---------- export ---------- */

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildStandaloneHtml() {
    var html = renderMarkdown(sourceEl.value);
    /* Parse into a detached, inert document so nothing is fetched. */
    var inert = new DOMParser().parseFromString(html, "text/html");
    var title = titleFrom(inert.body) || "Document";

    return [
      "<!DOCTYPE html>",
      '<html lang="en">',
      "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      "<title>" + escapeHtml(title) + "</title>",
      "<style>",
      paletteEl.textContent.trim(),
      EXPORT_BASE_CSS + docStyleEl.textContent.trim(),
      "</style>",
      "</head>",
      "<body>",
      '<div class="paper">',
      html.trim(),
      "</div>",
      "</body>",
      "</html>",
      ""
    ].join("\n");
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function htmlFilename() {
    return SOURCE_FILE.replace(/\.md$/i, "") + ".html";
  }

  /* ---------- view mode ---------- */

  function setView(view) {
    panesEl.className = "view-" + view;
    var buttons = document.querySelectorAll("#viewtoggle button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute(
        "aria-pressed",
        buttons[i].getAttribute("data-view") === view ? "true" : "false"
      );
    }
  }

  /* ---------- wiring ---------- */

  sourceEl.addEventListener("input", scheduleRender);

  document.getElementById("viewtoggle").addEventListener("click", function (event) {
    var view = event.target.getAttribute && event.target.getAttribute("data-view");
    if (view) { setView(view); }
  });

  document.getElementById("btn-html").addEventListener("click", function () {
    download(htmlFilename(), buildStandaloneHtml(), "text/html");
  });

  document.getElementById("btn-md").addEventListener("click", function () {
    download(SOURCE_FILE, sourceEl.value, "text/markdown");
  });

  /* Two-click confirm. A native confirm() dialog would block the page. */
  var resetArmed = false;
  var resetTimer = null;
  function disarmReset() {
    resetArmed = false;
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    resetBtn.textContent = "Reset to original";
  }
  resetBtn.addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = "Click again to discard edits";
      resetTimer = setTimeout(disarmReset, 8000);
      return;
    }
    disarmReset();
    storageClear();
    loadOriginal().then(setSource);
  });

  /* ---------- start ---------- */

  loadOriginal().then(function (original) {
    var saved = storageGet();
    setSource(saved !== null ? saved : original);
  });
})();
</script>
</body>
</html>
